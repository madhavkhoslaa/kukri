[package]
name = "kukri"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "kukri"
path = "src/main.rs"

[dependencies]
anyhow = "1"
libbpf-rs = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"

[build-dependencies]
libbpf-cargo = "0.27"

[profile.release]
lto = true
strip = true
