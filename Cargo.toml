[package]
name = "kukri"
version = "0.1.0"
edition = "2021"
build = "build/build.rs"

[[bin]]
name = "kukri"
path = "src/main.rs"

[dependencies]
anyhow = "1"
libbpf-rs = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6.7", features = ["derive"] }
ratatui = "0.30.2"
crossterm = "0.29.0"
libc = "0.2.189"

[build-dependencies]
libbpf-cargo = "0.27"

[profile.release]
lto = true
strip = true
